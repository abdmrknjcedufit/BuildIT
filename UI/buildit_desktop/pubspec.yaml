name: buildit_desktop
description: "BuildIT Desktop aplikacija - Prodaja i iznajmljivanje građevinskog materijala"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  fl_chart: ^0.69.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.4.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.5
  build_runner: ^2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300

